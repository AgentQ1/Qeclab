name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      # The runner image ships a Rust toolchain, which relay-bp's source build needs.
      - run: cargo --version
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python scripts/diagnose.py
      - run: .venv/bin/python -m pytest
